# 매거진 발행물 목록 동기화 — 새 호가 **검색엔진에도** 보이게
#
# 왜 필요한가 (2026-08-06 실측으로 발견)
#   매거진 탭은 두 겹으로 돈다:
#     · 정적 HTML  = content/magazine-snapshot.json 을 빌드 때 구워 넣은 것 → **검색엔진이 보는 것**
#     · 브라우저    = 매거진의 index.json 을 실시간으로 불러 갱신 → **사람이 보는 것**
#
#   매거진에 B05·B06·B07 을 발행했더니 사람에게는 8편이 보이는데
#   **정적 HTML 에는 5편만 있었다.** 홈페이지가 다시 배포되지 않았기 때문이다.
#   즉 **새 발행물이 검색에 잡히려면 홈페이지도 배포돼야 하는데, 아무도 그걸 부르지 않았다.**
#   사람이 기억해야 하는 절차는 결국 잊힌다.
#
#   → 매주 스냅샷을 받아 달라졌으면 커밋한다. 그 push 가 Cloudflare 빌드를 부르고,
#     빌드의 prebuild 가 다시 최신 스냅샷을 받아 정적 HTML 에 굽는다.
#
# 왜 매거진 쪽에서 이 저장소를 직접 부르지 않나
#   저장소를 넘나들려면 토큰을 하나 더 만들어 두 곳에 관리해야 한다.
#   급하면 Run workflow 를 누르면 된다. 토큰을 늘리지 않는 쪽을 택했다.
#
# ⚠ 2026-08-20 — 주간 → **매일**로 바꿨다
#   주 1회(일요일 밤)면 **월요일에 낸 브리프가 검색엔진에 다음 주 월요일까지 안 보인다.**
#   최악 7일 지연이고, 새 발행물이 가장 많이 읽히는 첫 주를 통째로 놓친다.
#   매일로 올려도 비용은 사실상 0 이다 — 16초짜리 job 이고, 목록이 그대로면
#   `git diff --staged --quiet` 에서 걸려 **커밋도 배포도 일어나지 않는다.**
#   (실측: 8/9·8/16 두 번의 정기 실행에서 실제 커밋은 각각 1건뿐)

name: 매거진 목록 동기화

on:
  schedule:
    # UTC 22:30 매일 = KST 07:30 매일.
    #   매거진의 「예약 발행」이 KST 08:00 에 도니 **그 직전**이다 —
    #   즉 오늘 아침 발행분은 내일 아침 동기화에 실린다(지연 하루).
    #   ⚠ 발행 직후에 맞추려고 시각을 뒤로 미루지 말 것: GitHub cron 은 정시를
    #     보장하지 않아(수십 분 지연) 「발행보다 먼저 도는 날」이 생긴다.
    #     하루 지연을 확실히 갖는 편이 낫다.
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: magazine-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write               # 실패 알림 이슈를 열고 댓글을 단다

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: 매거진 목록 받아오기
        env:
          # ★ 이 워크플로에서만 실패를 종료코드로 받는다 — 안 그러면 스크립트가
          #   「내려받기 실패 → 지난 스냅샷 유지 → exit 0」 으로 끝나서
          #   **매거진 목록이 며칠째 낡아도 실패 알림이 영영 안 뜬다.**
          #   배포 빌드(prebuild)는 이 값을 안 주므로 지금처럼 죽지 않는다.
          SYNC_STRICT: "1"
        run: node scripts/sync-magazine.mjs

      - name: 달라졌으면 커밋
        run: |
          git config user.name  "moyeon-bot"
          git config user.email "moyeon-bot@users.noreply.github.com"
          git add content/magazine-snapshot.json
          if git diff --staged --quiet; then
            echo "발행물 목록에 변동 없음 — 커밋하지 않습니다"
            exit 0
          fi
          n=$(node -e "console.log(require('./content/magazine-snapshot.json').발행물.length)")
          git commit -m "매거진 발행물 목록 동기화 — ${n}건"
          git push

      # ── 실패를 조용히 넘기지 않는다 ────────────────────────────────────
      # 왜 (2026-08-19 실사고): 예약 발행이 구글 시트 503 으로 죽었는데
      #   **다음 날까지 아무도 몰랐다.** 자동화의 진짜 위험은 「실패」가 아니라
      #   **「조용한 실패」**다 — 매일 도는 일이 3주째 죽어 있어도 아무 일도 안 일어난다.
      #
      # 어떻게: 같은 제목의 열린 이슈가 있으면 **댓글만** 달고, 없으면 새로 연다.
      #   매일 실패해도 이슈가 30개 생기지 않는다 — 스팸이 되면 결국 아무도 안 본다.
      #   고쳤으면 이슈를 닫는다. 그게 「봤다」는 표시가 된다.
      #
      # ⛔ 쉘 변수는 **ASCII 이름만** 쓴다 — bash 는 한글 변수명을 거부한다
      #   (이 저장소는 같은 함정을 workflow_dispatch input 에서 이미 밟았다 — publish.yml 머리말).
      # ⛔ `failure()` 만으로는 «매달려 죽는» 실패를 못 잡는다 —
      #   GitHub 은 timeout-minutes 초과를 **실패가 아니라 「취소」**로 처리하고,
      #   취소된 job 에서 `failure()` 스텝은 건너뛰어진다. 구글이 응답을 안 주고
      #   붙잡고 있으면 정확히 그 경로로 빠져 **알림이 한 통도 안 뜬다.**
      #   (사람이 손으로 취소한 경우에도 이슈가 열린다 — 그 소음보다 놓치는 쪽이 나쁘다.)
      #   〔2026-08-20 내부 리뷰가 잡은 것〕
      - name: 실패 알림
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★ gh 는 저장소를 «git remote» 로 찾는다 — checkout 스텝에서 죽으면
          #   .git 이 없어 `gh issue create` 가 "not a git repository" 로 같이 죽는다
          #   (실측 확인). GH_REPO 를 주면 checkout 과 무관하게 동작한다.
          GH_REPO: ${{ github.repository }}
          # ★ 실패 이슈를 «누가» 볼 것인가. 지정이 없으면 이슈는 열리지만
          #   아무에게도 안 간다 — 저장소를 직접 들여다보기 전에는 모른다.
          ASSIGNEE: donguk77
          LABEL: 자동화-실패
          TITLE: "⚠ 「매거진 목록 동기화」가 실패했습니다"
        run: |
          set -u
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY=$(printf '워크플로 **%s** 가 실패했습니다.\n\n- 실행 기록: %s\n- 시각(KST): %s\n\n이 이슈는 자동으로 열렸습니다. **고쳤으면 닫아 주세요** — 다음 실패는 여기에 댓글로 쌓입니다.' \
                 "$GITHUB_WORKFLOW" "$RUN_URL" "$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')")
          gh label create "$LABEL" --color B60205 \
             --description "예약 작업이 실패하면 자동으로 붙습니다" >/dev/null 2>&1 || true
          # ★ jq 식 안에서 제목을 비교하지 않는다 — 한글·기호가 섞여 있어 따옴표가 깨진다.
          #   대신 「번호<탭>제목」으로 뽑아 awk 로 **둘째 칸을 정확히** 비교한다.
          #   ⛔ grep -F 를 쓰면 안 된다: «포함»만 해도 맞아서, 누가 「…실패했습니다 — 긴급」
          #     같은 이슈를 손으로 열어 두면 거기에 댓글이 쌓인다. 에러도 안 나서 눈치채기 어렵다.
          #     〔2026-08-20 외부 리뷰(DeepSeek-V4-Pro)가 잡은 것〕
          #   ▲ set -o pipefail 은 일부러 안 켠다 — gh issue list 가 죽었을 때 스텝을 같이
          #     죽이면 «알림 자체가 사라진다». 중복 이슈 한 건이 알림 없는 것보다 낫다.
          #   ⚠ --limit 을 반드시 준다: gh 기본이 **30건**이라, 라벨을 공유하는 이슈가
          #     30개를 넘으면 열린 이슈를 못 찾고 새로 연다 — 「스팸 방지」 설계가 거기서 깨진다.
          #     〔2026-08-20 외부 리뷰(Kimi-K3)가 잡은 것〕
          NUM=$(gh issue list --label "$LABEL" --state open --limit 100 --json number,title \
                --jq '.[] | "\(.number)\t\(.title)"' \
                | awk -F'\t' -v t="$TITLE" '$2 == t { print $1; exit }')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
            echo "이미 열린 이슈 #$NUM 에 댓글을 달았습니다"
          else
            URL=$(gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY")
            echo "$URL"
            # ★ 담당자는 «따로» 붙인다. create 에 --assignee 를 함께 주면
            #   그 사람이 할당 불가일 때(협업자가 아니거나 계정이 바뀌면)
            #   «이슈 생성 자체»가 실패한다 — 알림이 통째로 사라지는 게 제일 나쁘다.
            gh issue edit "$URL" --add-assignee "$ASSIGNEE" || \
              echo "담당자($ASSIGNEE) 지정 실패 — 이슈는 열렸습니다"
          fi
